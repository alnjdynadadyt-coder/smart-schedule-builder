<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات المدرسة - منظومة بناء الجداول</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body id="pageBody" class="bg-indigo-900 text-white min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-md shadow-sm py-5 border-b border-white/10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-lg text-sm transition flex items-center gap-1">
                    ⬅️ القائمة الرئيسية
                </a>
                <h1 class="text-xl font-bold">⚙️ إعدادات المدرسة</h1>
            </div>
            <span id="schoolNameHeader" class="text-sm font-semibold opacity-90"></span>
        </div>
    </header>

    <!-- Main Form Content -->
    <main class="container mx-auto px-4 py-8 max-w-xl flex-grow">
        <div id="cardContainer" class="p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md">
            <h2 class="text-lg font-bold mb-4 border-b pb-2 border-white/25">البيانات الأساسية ونظام الدوام</h2>
            
            <form id="settingsForm" onsubmit="saveSettings(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2">اسم المدرسة:</label>
                    <input type="text" id="schoolName" required class="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="أدخل اسم المدرسة هنا...">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">أيام الدوام الأسبوعي:</label>
                    <select id="schoolDays" class="w-full px-4 py-2.5 rounded-xl bg-slate-800/80 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50">
                        <option value="5">5 أيام (الأحد إلى الخميس)</option>
                        <option value="6">6 أيام (السبت إلى الخميس)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">عدد الحصص الدراسية في اليوم:</label>
                    <input type="number" id="dailyClasses" min="4" max="8" value="7" required class="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>

                <!-- زر واختيار لون خاص لهذه الصفحة -->
                <div>
                    <label class="block text-sm font-semibold mb-2">🎨 لون ثيم هذه الصفحة:</label>
                    <select id="pageThemeSelect" onchange="changePageTheme(this.value)" class="w-full px-4 py-2.5 rounded-xl bg-slate-800/80 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50">
                        <option value="bg-indigo-900">نيللي غامق (افتراضي)</option>
                        <option value="bg-slate-900">الداكن الليلي</option>
                        <option value="bg-emerald-900">زمردي غامق</option>
                        <option value="bg-purple-900">أرجواني داكن</option>
                        <option value="bg-blue-600">أزرق حالم</option>
                        <option value="bg-teal-800">تيل مميز</option>
                        <option value="bg-rose-900">وردي داكن</option>
                        <option value="bg-slate-100 text-gray-900">رمادي فاتح نظيف</option>
                        <option value="bg-amber-50 text-gray-900">أصفر ذهبي ناعم</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-grow bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition cursor-pointer">
                        💾 حفظ الإعدادات
                    </button>
                    <button type="button" onclick="clearData()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-5 py-3 rounded-xl shadow-lg transition cursor-pointer" title="حذف كل بيانات الحفظ">
                        🗑️ حذف الحفظ
                    </button>
                </div>
            </form>
            
            <div id="saveAlert" class="mt-4 hidden p-3 bg-emerald-500/30 border border-emerald-400 text-emerald-100 rounded-xl text-center text-sm">
                تم حفظ الإعدادات وتطبيق اللون بنجاح!
            </div>
            <div id="clearAlert" class="mt-4 hidden p-3 bg-rose-500/30 border border-rose-400 text-rose-100 rounded-xl text-center text-sm">
                تم حذف وتفريغ جميع البيانات بنجاح!
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter" class="bg-slate-800 text-slate-300 border-t border-white/10 py-4 text-center text-sm transition-colors duration-300">
        منظومة بناء الجداول المدرسية الذكية &copy; 2026
    </footer>

    <script>
        // تحميل إعدادات المدرسة
        let settings = JSON.parse(localStorage.getItem('sch_settings')) || { 
            name: '', 
            days: '5',
            dailyClasses: 7,
            theme: 'bg-indigo-900'
        };

        // تطبيق اللون الخاص بصفحة الإعدادات المحفوظ مسبقاً
        function applyPageTheme(themeClass) {
            let body = document.getElementById('pageBody');
            let card = document.getElementById('cardContainer');
            let footer = document.getElementById('mainFooter');
            let selectBox = document.getElementById('pageThemeSelect');

            // تنظيف classes القديمة للون
            body.className = `${themeClass} min-h-screen flex flex-col justify-between transition-colors duration-300`;
            
            if (themeClass.includes('slate-100') || themeClass.includes('amber-50')) {
                // ثيمات فاتحة
                body.className += " text-gray-900";
                card.className = "p-6 rounded-2xl shadow-xl border bg-white/80 border-gray-300 text-gray-900 backdrop-blur-md";
                footer.className = "bg-gray-200 text-gray-700 border-t border-gray-300 py-4 text-center text-sm transition-colors duration-300";
                selectBox.className = "w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500";
            } else {
                // ثيمات داكنة
                body.className += " text-white";
                card.className = "p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md";
                footer.className = "bg-black/30 text-slate-300 border-t border-white/10 py-4 text-center text-sm transition-colors duration-300";
                selectBox.className = "w-full px-4 py-2.5 rounded-xl bg-slate-800/80 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50";
            }
        }

        // عند تغيير اللون من القائمة المنسدلة مباشرة
        function changePageTheme(colorClass) {
            settings.theme = colorClass;
            applyPageTheme(colorClass);
        }

        // تعبئة الحقول والقيم المخزنة عند التحميل
        document.getElementById('schoolName').value = settings.name || '';
        document.getElementById('schoolDays').value = settings.days || '5';
        document.getElementById('dailyClasses').value = settings.dailyClasses || 7;
        document.getElementById('schoolNameHeader').innerText = settings.name || '';
        
        if(settings.theme) {
            document.getElementById('pageThemeSelect').value = settings.theme;
            applyPageTheme(settings.theme);
        }

        function saveSettings(event) {
            event.preventDefault();
            settings.name = document.getElementById('schoolName').value;
            settings.days = document.getElementById('schoolDays').value;
            settings.dailyClasses = document.getElementById('dailyClasses').value;
            settings.theme = document.getElementById('pageThemeSelect').value;
            
            localStorage.setItem('sch_settings', JSON.stringify(settings));
            document.getElementById('schoolNameHeader').innerText = settings.name;
            
            let alertBox = document.getElementById('saveAlert');
            alertBox.classList.remove('hidden');
            setTimeout(() => { alertBox.classList.add('hidden'); }, 3000);
        }

        function clearData() {
            if(confirm('هل أنت متأكد من رغبتك في حذف وحفظ البيانات؟')) {
                localStorage.removeItem('sch_settings');
                
                settings = { name: '', days: '5', dailyClasses: 7, theme: 'bg-indigo-900' };
                document.getElementById('schoolName').value = '';
                document.getElementById('schoolDays').value = '5';
                document.getElementById('dailyClasses').value = 7;
                document.getElementById('schoolNameHeader').innerText = '';
                document.getElementById('pageThemeSelect').value = 'bg-indigo-900';
                applyPageTheme('bg-indigo-900');
                
                let clearAlert = document.getElementById('clearAlert');
                clearAlert.classList.remove('hidden');
                setTimeout(() => { clearAlert.classList.add('hidden'); }, 3000);
            }
        }
    </script>
</body>
</html>
