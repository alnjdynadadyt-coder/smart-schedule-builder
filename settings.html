<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات المدرسة - منظومة بناء الجداول</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body id="pageBody" class="bg-indigo-900 text-white min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-md shadow-sm py-5 border-b border-white/10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-lg text-sm transition flex items-center gap-1">
                    ⬅️ القائمة الرئيسية
                </a>
                <h1 class="text-xl font-bold">⚙️ إعدادات المدرسة</h1>
            </div>
            <span id="schoolNameHeader" class="text-sm opacity-80">المدرسة الافتراضية</span>
        </div>
    </header>

    <!-- Main Form Content -->
    <main class="container mx-auto px-4 py-8 max-w-xl flex-grow">
        <div id="cardContainer" class="p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md">
            <h2 class="text-lg font-bold mb-4 border-b pb-2 border-white/20">البيانات الأساسية ونظام الدوام</h2>
            
            <form id="settingsForm" onsubmit="saveSettings(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2">اسم المدرسة:</label>
                    <input type="text" id="schoolName" required class="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="أدخل اسم المدرسة...">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">أيام الدوام الأسبوعي:</label>
                    <select id="schoolDays" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50">
                        <option value="5">5 أيام (الأحد إلى الخميس)</option>
                        <option value="6">6 أيام (السبت إلى الخميس)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">عدد الحصص الدراسية في اليوم:</label>
                    <input type="number" id="dailyClasses" min="4" max="8" value="7" required class="w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition cursor-pointer">
                        💾 حفظ الإعدادات
                    </button>
                </div>
            </form>
            
            <div id="saveAlert" class="mt-4 hidden p-3 bg-emerald-500/30 border border-emerald-400 text-emerald-100 rounded-xl text-center text-sm">
                تم حفظ الإعدادات وتحديث اسم المدرسة بنجاح!
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter" class="bg-slate-800 text-slate-300 border-t border-white/10 py-4 text-center text-sm transition-colors duration-300">
        منظومة بناء الجداول المدرسية الذكية &copy; 2026
    </footer>

    <script>
        let settings = JSON.parse(localStorage.getItem('sch_settings')) || { 
            name: 'المدرسة الافتراضية', 
            days: '5',
            dailyClasses: 7,
            pageTheme: 'bg-indigo-900 text-white',
            cardTheme: 'bg-white/10 border-white/20 text-white',
            footerTheme: 'bg-slate-800 text-slate-300'
        };

        // تعبئة الحقول بالبيانات المخزنة مسبقاً
        document.getElementById('schoolName').value = settings.name || 'المدرسة الافتراضية';
        document.getElementById('schoolDays').value = settings.days || '5';
        document.getElementById('dailyClasses').value = settings.dailyClasses || 7;
        document.getElementById('schoolNameHeader').innerText = settings.name || 'المدرسة الافتراضية';

        // تطبيق الثيم الشامل المحفوظ
        function applyTheme() {
            if(settings.pageTheme) {
                document.getElementById('pageBody').className = `${settings.pageTheme} min-h-screen flex flex-col justify-between transition-colors duration-300`;
                document.getElementById('cardContainer').className = `p-6 rounded-2xl shadow-xl border backdrop-blur-md ${settings.cardTheme || 'bg-white/10 border-white/20 text-white'}`;
                document.getElementById('mainFooter').className = `${settings.footerTheme || 'bg-slate-800 text-slate-300'} border-t border-white/10 py-4 text-center text-sm transition-colors duration-300`;
            }
        }
        applyTheme();

        function saveSettings(event) {
            event.preventDefault();
            settings.name = document.getElementById('schoolName').value;
            settings.days = document.getElementById('schoolDays').value;
            settings.dailyClasses = document.getElementById('dailyClasses').value;
            
            localStorage.setItem('sch_settings', JSON.stringify(settings));
            document.getElementById('schoolNameHeader').innerText = settings.name;
            
            let alertBox = document.getElementById('saveAlert');
            alertBox.classList.remove('hidden');
            setTimeout(() => { alertBox.classList.add('hidden'); }, 3000);
        }
    </script>
</body>
</html>
