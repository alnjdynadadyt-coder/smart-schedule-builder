<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد وعرض الجداول المدرسية - aSc Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&family=Readex+Pro:wght@400;600&family=Changa:wght@400;600&family=El+Messiri:wght@400;700&display=swap');
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--page-bg, #311b92); 
            color: var(--text-main, #ffffff); 
            direction: rtl; 
            text-align: right; 
            transition: background-color 0.3s ease, color 0.3s ease; 
        }

        .custom-subject-style {
            font-family: var(--sub-font, 'Cairo');
            font-size: var(--sub-size, 16px);
            color: var(--sub-color, #fde047);
        }

        .custom-teacher-style {
            font-family: var(--tch-font, 'Cairo');
            font-size: var(--tch-size, 14px);
            color: var(--tch-color, #ffffff);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-container { background: white !important; color: black !important; border: 1px solid #000 !important; box-shadow: none !important; }
            table { border-collapse: collapse !important; width: 100% !important; direction: rtl !important; }
            th, td { border: 1px solid #000 !important; color: #000 !important; background-color: #fff !important; text-align: center !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-black/30 backdrop-blur-md shadow-sm py-4 border-b border-white/10 no-print">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-lg text-sm transition flex items-center gap-1 shadow">
                    ⬅️ القائمة الرئيسية
                </a>
                <h1 class="text-xl font-bold">📊 توليد وعرض الجداول المدرسية (aSc Engine)</h1>
            </div>
            <span id="schoolNameHeader" class="text-sm font-semibold opacity-90"></span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow max-w-7xl">
        
        <!-- لوحة التحكم في العرض والتنسيق والخطوط والثيم -->
        <div class="p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 backdrop-blur-md mb-8 no-print space-y-6">
            <div class="flex flex-wrap gap-4 justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold mb-1">⚙️ محرك بناء الجداول الذكي ولوحة التنسيق</h2>
                    <p class="text-sm opacity-85">تحكم بطرق العرض، تخصيص الخطوط بدقة، الثيم، والحفظ المؤقت والتوليد.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="generateNewSchedule(true)" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1">
                        🔄 توليد جدول جديد
                    </button>
                    <button onclick="saveTempSchedule()" class="bg-amber-600 hover:bg-amber-500 text-slate-900 text-xs font-bold px-3 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1">
                        💾 حفظ مؤقت
                    </button>
                    <button onclick="clearTempSchedule()" class="bg-rose-700 hover:bg-rose-600 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1">
                        🗑️ حذف الحفظ المؤقت
                    </button>
                    <button onclick="exportToExcel()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1">
                        📊 تصدير Excel (RTL)
                    </button>
                    <button onclick="exportToWord()" class="bg-blue-700 hover:bg-blue-600 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1">
                        📝 تصدير Word (RTL)
                    </button>
                    <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center gap-1">
                        🖨️ طباعة / PDF
                    </button>
                </div>
            </div>

            <!-- أزرار اختيار نمط العرض -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 border-t border-white/15 pt-4">
                <button onclick="switchView('class')" id="btnViewClass" class="py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-amber-500 text-slate-900">
                    📋 النموذج الأول: حسب الصف والشعبة
                </button>
                <button onclick="switchView('day')" id="btnViewDay" class="py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-white/10 hover:bg-white/20">
                    📅 النموذج الثاني: حسب اليوم لكافة الشعب
                </button>
                <button onclick="switchView('teacher')" id="btnViewTeacher" class="py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-white/10 hover:bg-white/20">
                    👨‍🏫 النموذج الثالث: حسب جدول المدرس
                </button>
            </div>

            <!-- لوحة تحكم تخصيص الخطوط، الأحجام والثيم -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 bg-black/20 p-4 rounded-xl border border-white/10 items-center">
                <div>
                    <label class="block text-xs font-bold mb-1 opacity-90">نوع خط المادة:</label>
                    <select id="fontFamilySubject" onchange="applyStylingPreferences()" class="w-full bg-slate-800 text-white text-xs p-2 rounded-lg border border-white/20">
                        <option value="'Cairo', sans-serif">كايرو (Cairo)</option>
                        <option value="'Tajawal', sans-serif">تجوال (Tajawal)</option>
                        <option value="'Amiri', serif">أميري (Amiri)</option>
                        <option value="'Readex Pro', sans-serif">ريادكس (Readex Pro)</option>
                        <option value="'Changa', sans-serif">شنطة (Changa)</option>
                        <option value="'El Messiri', sans-serif">المسيري (El Messiri)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 opacity-90">حجم ولون خط المادة:</label>
                    <div class="flex gap-2">
                        <select id="fontSizeSubject" onchange="applyStylingPreferences()" class="w-1/2 bg-slate-800 text-white text-xs p-2 rounded-lg border border-white/20">
                            <option value="14px">14</option><option value="15px">15</option><option value="16px" selected>16</option>
                            <option value="17px">17</option><option value="18px">18</option><option value="19px">19</option>
                            <option value="20px">20</option><option value="21px">21</option><option value="22px">22</option><option value="23px">23</option>
                        </select>
                        <input type="color" id="fontColorSubject" value="#fde047" onchange="applyStylingPreferences()" class="w-1/2 h-9 bg-transparent cursor-pointer rounded-lg border border-white/20 p-1">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 opacity-90">نوع خط المدرس:</label>
                    <select id="fontFamilyTeacher" onchange="applyStylingPreferences()" class="w-full bg-slate-800 text-white text-xs p-2 rounded-lg border border-white/20">
                        <option value="'Cairo', sans-serif">كايرو (Cairo)</option>
                        <option value="'Tajawal', sans-serif">تجوال (Tajawal)</option>
                        <option value="'Amiri', serif">أميري (Amiri)</option>
                        <option value="'Readex Pro', sans-serif">ريادكس (Readex Pro)</option>
                        <option value="'Changa', sans-serif">شنطة (Changa)</option>
                        <option value="'El Messiri', sans-serif">المسيري (El Messiri)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 opacity-90">حجم ولون خط المدرس:</label>
                    <div class="flex gap-2">
                        <select id="fontSizeTeacher" onchange="applyStylingPreferences()" class="w-1/2 bg-slate-800 text-white text-xs p-2 rounded-lg border border-white/20">
                            <option value="14px" selected>14</option><option value="15px">15</option><option value="16px">16</option>
                            <option value="17px">17</option><option value="18px">18</option><option value="19px">19</option>
                            <option value="20px">20</option><option value="21px">21</option><option value="22px">22</option><option value="23px">23</option>
                        </select>
                        <input type="color" id="fontColorTeacher" value="#ffffff" onchange="applyStylingPreferences()" class="w-1/2 h-9 bg-transparent cursor-pointer rounded-lg border border-white/20 p-1">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 opacity-90">🎨 لون ثيم الصفحة:</label>
                    <input type="color" id="pageThemeColor" value="#311b92" onchange="applyPageTheme()" class="w-full h-9 bg-transparent cursor-pointer rounded-lg border border-white/20 p-1">
                </div>
            </div>
        </div>

        <!-- منطقة عرض الجداول -->
        <div id="schedulesOutputContainer" class="space-y-8" dir="rtl"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-black/40 border-t border-white/10 py-4 text-center text-sm no-print">
        منظومة بناء الجداول المدرسية الذكية &copy; 2026
    </footer>

    <script>
        let settings = JSON.parse(localStorage.getItem('sch_settings')) || { name: '' };
        document.getElementById('schoolNameHeader').innerText = settings.name || '';

        const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
        const periodsCount = 7;
        let currentViewMode = 'class';
        let globalMasterSchedule = null;

        function switchView(mode) {
            currentViewMode = mode;
            document.getElementById('btnViewClass').className = mode === 'class' ? 'py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-amber-500 text-slate-900' : 'py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-white/10 hover:bg-white/25';
            document.getElementById('btnViewDay').className = mode === 'day' ? 'py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-amber-500 text-slate-900' : 'py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-white/10 hover:bg-white/25';
            document.getElementById('btnViewTeacher').className = mode === 'teacher' ? 'py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-amber-500 text-slate-900' : 'py-3 px-4 rounded-xl font-bold text-sm transition shadow cursor-pointer bg-white/10 hover:bg-white/25';
            
            if (globalMasterSchedule) renderCurrentView();
        }

        function loadShortcuts() {
            let teachers = JSON.parse(localStorage.getItem('sch_teachers')) || [];
            let subjects = JSON.parse(localStorage.getItem('sch_subjects')) || [];
            let tMap = {}, sMap = {};
            teachers.forEach(t => tMap[t.name] = (t.shortName && t.shortName.trim() !== '') ? t.shortName : t.name);
            subjects.forEach(s => sMap[s.name] = (s.shortName && s.shortName.trim() !== '') ? s.shortName : s.name);
            return { tMap, sMap };
        }

        function generateNewSchedule(isNewAction = false) {
            let distributions = JSON.parse(localStorage.getItem('sch_distributions')) || [];
            let container = document.getElementById('schedulesOutputContainer');

            if (distributions.length === 0) {
                container.innerHTML = `<div class="text-center py-12 bg-rose-500/20 rounded-2xl border border-rose-500/30 text-rose-200">لا توجد إسنادات مسجلة! يرجى إدخال إسنادات المدرسين أولاً.</div>`;
                return;
            }

            let { tMap, sMap } = loadShortcuts();
            let sectionSchedules = {}; 
            let teacherSchedules = {}; 

                // نحتاج أيضاً لتحميل اختصارات الصفوف إذا كانت متوفرة، أو استخدام الاسم
    let classesData = JSON.parse(localStorage.getItem('sch_classes')) || [];
    let classMap = {};
    classesData.forEach(c => {
        if (c.name) classMap[c.name] = c.shortName || c.name;
    });

    distributions.forEach(item => {
        let className = item.className;
        let classShort = classMap[className] || className; // اختصار الصف
        let sections = item.sections || [item.section];
        sections.forEach(sec => {
            let key = `${classShort} - شعبة ${sec}`; // استخدام اختصار الصف
            if (!sectionSchedules[key]) {
                sectionSchedules[key] = {};
                daysOfWeek.forEach(day => {
                    sectionSchedules[key][day] = Array(periodsCount).fill(null);
                });
            }
        });
    });

    distributions.forEach(item => {
        let sections = item.sections || [item.section];
        let subjectFull = item.subject;
        let teacherFull = item.teacher;
        let subShort = sMap[subjectFull] || subjectFull;
        let tchShort = tMap[teacherFull] || teacherFull;
        let classShort = classMap[item.className] || item.className;
        let weeklyCount = parseInt(item.lessonsCount) || 4;
        let allowedDays = item.days && item.days.length > 0 ? item.days.filter(d => d !== 'السبت') : daysOfWeek;
        let excludedLessons = item.excludedLessons || [];

        sections.forEach(sec => {
            let key = `${classShort} - شعبة ${sec}`; // استخدام اختصار الصف هنا أيضاً
            if (!sectionSchedules[key]) return;

            let placed = 0;
            let pass = 0;
            let shuffledDays = [...allowedDays].sort(() => Math.random() - 0.5);

            while (placed < weeklyCount && pass < 10) {
                for (let d = 0; d < shuffledDays.length && placed < weeklyCount; d++) {
                    let day = shuffledDays[d];
                    let periodIndices = [1, 2, 4, 0, 3, 5, 6].sort(() => Math.random() - 0.5); 
                    for (let i = 0; i < periodIndices.length && placed < weeklyCount; i++) {
                        let p = periodIndices[i];
                        let periodName = `الدرس ${p + 1}`;
                        
                        if (!excludedLessons.includes(periodName) && sectionSchedules[key][day][p] === null) {
                            if (pass === 0) {
                                let dayHasSubject = sectionSchedules[key][day].some(cell => cell && cell.subject === subShort);
                                if (dayHasSubject) continue;
                            }
                            
                            sectionSchedules[key][day][p] = {
                                subject: subShort,  // اختصار المادة
                                teacher: tchShort,  // اختصار المدرس
                                fullClassName: key
                            };
                            placed++;
                        }
                    }
                }
                pass++;
            }
        });
    });

                                    placed++;
                                }
                            }
                        }
                        pass++;
                    }
                });
            });

            Object.keys(sectionSchedules).forEach(secKey => {
                daysOfWeek.forEach(day => {
                    for (let p = 0; p < periodsCount; p++) {
                        let cell = sectionSchedules[secKey][day][p];
                        if (cell) {
                            let tch = cell.teacher;
                            if (!teacherSchedules[tch]) {
                                teacherSchedules[tch] = {};
                                daysOfWeek.forEach(d => teacherSchedules[tch][d] = Array(periodsCount).fill(null));
                            }
                            teacherSchedules[tch][day][p] = {
                                subject: cell.subject,
                                classInfo: secKey
                            };
                        }
                    }
                });
            });

            globalMasterSchedule = { sectionSchedules, teacherSchedules };
            renderCurrentView();
            saveTempScheduleSilently();
            if (isNewAction) {
                alert('🔄 تم توليد جدول جديد بنجاح!');
            }
        }

        function saveTempScheduleSilently() {
            if (!globalMasterSchedule) return;
            let saveData = {
                master: globalMasterSchedule,
                prefs: {
                    fSub: document.getElementById('fontFamilySubject').value,
                    sSub: document.getElementById('fontSizeSubject').value,
                    cSub: document.getElementById('fontColorSubject').value,
                    fTch: document.getElementById('fontFamilyTeacher').value,
                    sTch: document.getElementById('fontSizeTeacher').value,
                    cTch: document.getElementById('fontColorTeacher').value,
                    theme: document.getElementById('pageThemeColor').value
                }
            };
            localStorage.setItem('sch_temp_complete_state', JSON.stringify(saveData));
        }

        function saveTempSchedule() {
            saveTempScheduleSilently();
            alert('💾 تم حفظ الجدول وكافة الإعدادات والخطوط مؤقتًا بنجاح!');
        }

        function clearTempSchedule() {
            localStorage.removeItem('sch_temp_complete_state');
            alert('🗑️ تم حذف الحفظ المؤقت بنجاح!');
            location.reload();
        }

        function applyStylingPreferences() {
            let fSub = document.getElementById('fontFamilySubject').value;
            let sSub = document.getElementById('fontSizeSubject').value;
            let cSub = document.getElementById('fontColorSubject').value;

            let fTch = document.getElementById('fontFamilyTeacher').value;
            let sTch = document.getElementById('fontSizeTeacher').value;
            let cTch = document.getElementById('fontColorTeacher').value;

            document.documentElement.style.setProperty('--sub-font', fSub);
            document.documentElement.style.setProperty('--sub-size', sSub);
            document.documentElement.style.setProperty('--sub-color', cSub);

            document.documentElement.style.setProperty('--tch-font', fTch);
            document.documentElement.style.setProperty('--tch-size', sTch);
            document.documentElement.style.setProperty('--tch-color', cTch);

            saveTempScheduleSilently();
        }

        function applyPageTheme() {
            let themeColor = document.getElementById('pageThemeColor').value;
            document.documentElement.style.setProperty('--page-bg', themeColor);
            document.body.style.backgroundColor = themeColor;

            // حساب السطوع تلقائياً للتحكم بلون الخط الرئيسي لتجنب اختفاء النصوص عند اختيار الثيم الأبيض
            let r = parseInt(themeColor.substr(1,2), 16);
            let g = parseInt(themeColor.substr(3,2), 16);
            let b = parseInt(themeColor.substr(5,2), 16);
            let brightness = (r * 299 + g * 587 + b * 114) / 1000;
            
            if (brightness > 160) {
                document.documentElement.style.setProperty('--text-main', '#0f172a');
            } else {
                document.documentElement.style.setProperty('--text-main', '#ffffff');
            }

            saveTempScheduleSilently();
        }

        function renderCurrentView() {
            let container = document.getElementById('schedulesOutputContainer');
            container.innerHTML = '';
            if (!globalMasterSchedule) return;

            if (currentViewMode === 'class') {
                let keys = Object.keys(globalMasterSchedule.sectionSchedules);
                keys.forEach(key => {
                    let schData = globalMasterSchedule.sectionSchedules[key];
                    let html = `
                        <div class="print-container p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 backdrop-blur-md mb-8">
                            <h3 class="text-xl font-bold mb-4 border-b pb-2 border-white/25 text-amber-400">📅 جدول حصص: ${key}</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-center border-collapse text-sm border border-white/30" dir="rtl">
                                    <thead>
                                        <tr class="bg-black/30 border-b border-white/30 font-bold">
                                            <th class="py-3 px-3 border border-white/30">اليوم / الحصة</th>`;
                    for (let i = 1; i <= periodsCount; i++) {
                        html += `<th class="py-3 px-2 border border-white/30">الدرس ${i}</th>`;
                    }
                    html += `</tr></thead><tbody>`;

                    daysOfWeek.forEach(day => {
                        html += `<tr class="border-b border-white/20 hover:bg-white/5"><td class="py-3 px-3 border border-white/30 font-bold bg-black/20">${day}</td>`;
                        for (let p = 0; p < periodsCount; p++) {
                            let cell = schData[day][p];
                            let content = cell ? `<div style="line-height: 1.3;"><span class="custom-subject-style font-bold">${cell.subject}</span><br><span class="custom-teacher-style">${cell.teacher}</span></div>` : ``;
                            html += `<td class="py-3 px-2 border border-white/30 h-16 align-middle">${content}</td>`;
                        }
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div></div>`;
                    container.innerHTML += html;
                });

            } else if (currentViewMode === 'day') {
                let sectionKeys = Object.keys(globalMasterSchedule.sectionSchedules);
                daysOfWeek.forEach(day => {
                    let html = `
                        <div class="print-container p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 backdrop-blur-md mb-8">
                            <h3 class="text-xl font-bold mb-4 border-b pb-2 border-white/25 text-amber-400">📅 جدول يوم: ${day} (كافة الشعب)</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-center border-collapse text-sm border border-white/30" dir="rtl">
                                    <thead>
                                        <tr class="bg-black/30 border-b border-white/30 font-bold">
                                            <th class="py-3 px-3 border border-white/30">الصف والشعبة</th>`;
                    for (let i = 1; i <= periodsCount; i++) {
                        html += `<th class="py-3 px-2 border border-white/30">الدرس ${i}</th>`;
                    }
                    html += `</tr></thead><tbody>`;

                    sectionKeys.forEach(secKey => {
                        html += `<tr class="border-b border-white/20 hover:bg-white/5"><td class="py-3 px-3 border border-white/30 font-bold bg-black/20">${secKey}</td>`;
                        for (let p = 0; p < periodsCount; p++) {
                            let cell = globalMasterSchedule.sectionSchedules[secKey][day][p];
                            let content = cell ? `<div style="line-height: 1.3;"><span class="custom-subject-style font-bold">${cell.subject}</span><br><span class="custom-teacher-style">${cell.teacher}</span></div>` : ``;
                            html += `<td class="py-3 px-2 border border-white/30 h-16 align-middle">${content}</td>`;
                        }
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div></div>`;
                    container.innerHTML += html;
                });

            } else if (currentViewMode === 'teacher') {
                let teachers = Object.keys(globalMasterSchedule.teacherSchedules);
                if (teachers.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 bg-white/5 rounded-2xl border border-white/10">لا توجد بيانات للمدرسين.</div>`;
                    return;
                }

                teachers.forEach(tch => {
                    let tchData = globalMasterSchedule.teacherSchedules[tch];
                    let html = `
                        <div class="print-container p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 backdrop-blur-md mb-8">
                            <h3 class="text-xl font-bold mb-4 border-b pb-2 border-white/25 text-amber-400">👨‍🏫 جدول حصص المدرس: ${tch}</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-center border-collapse text-sm border border-white/30" dir="rtl">
                                    <thead>
                                        <tr class="bg-black/30 border-b border-white/30 font-bold">
                                            <th class="py-3 px-3 border border-white/30">اليوم / الحصة</th>`;
                    for (let i = 1; i <= periodsCount; i++) {
                        html += `<th class="py-3 px-2 border border-white/30">الدرس ${i}</th>`;
                    }
                    html += `</tr></thead><tbody>`;

                    daysOfWeek.forEach(day => {
                        html += `<tr class="border-b border-white/20 hover:bg-white/5"><td class="py-3 px-3 border border-white/30 font-bold bg-black/20">${day}</td>`;
                        for (let p = 0; p < periodsCount; p++) {
                            let cell = tchData[day][p];
                            let content = cell ? `<div style="line-height: 1.3;"><span class="custom-subject-style font-bold">${cell.subject}</span><br><span class="custom-teacher-style">${cell.classInfo}</span></div>` : ``;
                            html += `<td class="py-3 px-2 border border-white/30 h-16 align-middle">${content}</td>`;
                        }
                        html += `</tr>`;
                    });
                    html += `</tbody></table></div></div>`;
                    container.innerHTML += html;
                });
            }
        }

        function exportToExcel() {
            let htmlContent = document.getElementById('schedulesOutputContainer').innerHTML;
            let excelWrapper = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/1999/xlink">
            <head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>School Schedules</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head>
            <body dir="rtl"><div style="direction: rtl; text-align: right; unicode-bidi: embed; font-family: Cairo, Arial, sans-serif;">${htmlContent}</div></body></html>`;
            
            let blob = new Blob(['\ufeff' + excelWrapper], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'School_Schedules.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function exportToWord() {
            let htmlContent = document.getElementById('schedulesOutputContainer').innerHTML;
            let wordWrapper = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>School Schedules</title>
            <style>
                body { direction: rtl; text-align: right; font-family: 'Cairo', Arial, sans-serif; }
                table { border-collapse: collapse; width: 100%; margin-bottom: 20px; direction: rtl; }
                th, td { border: 1px solid windowtext; padding: 8px; text-align: center; font-size: 11pt; direction: rtl; }
                th { background-color: #f2f2f2; }
            </style>
            </head>
            <body dir="rtl"><div style="direction: rtl; text-align: right; unicode-bidi: embed;">${htmlContent}</div></body></html>`;

            let blob = new Blob(['\ufeff' + wordWrapper], { type: 'application/msword;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'School_Schedules.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.onload = function() {
            let savedState = localStorage.getItem('sch_temp_complete_state');
            if (savedState) {
                let parsed = JSON.parse(savedState);
                globalMasterSchedule = parsed.master;
                if (parsed.prefs) {
                    document.getElementById('fontFamilySubject').value = parsed.prefs.fSub || "'Cairo', sans-serif";
                    document.getElementById('fontSizeSubject').value = parsed.prefs.sSub || "16px";
                    document.getElementById('fontColorSubject').value = parsed.prefs.cSub || "#fde047";
                    document.getElementById('fontFamilyTeacher').value = parsed.prefs.fTch || "'Cairo', sans-serif";
                    document.getElementById('fontSizeTeacher').value = parsed.prefs.sTch || "14px";
                    document.getElementById('fontColorTeacher').value = parsed.prefs.cTch || "#ffffff";
                    if (parsed.prefs.theme) {
                        document.getElementById('pageThemeColor').value = parsed.prefs.theme;
                        applyPageTheme();
                    }
                }
                applyStylingPreferences();
                renderCurrentView();
            } else {
                generateNewSchedule(false);
            }
        };
    </script>
</body>
