<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الصفوف والشعب - منظومة بناء الجداول</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body id="pageBody" class="bg-indigo-900 text-white min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-md shadow-sm py-5 border-b border-white/10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-lg text-sm transition flex items-center gap-1">
                    ⬅️ القائمة الرئيسية
                </a>
                <h1 class="text-xl font-bold">🏫 صفحة الصفوف والشعب</h1>
            </div>
            <span id="schoolNameHeader" class="text-sm font-semibold opacity-90"></span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-3xl flex-grow">
        
        <!-- نموذج الإضافة -->
        <div id="cardContainer" class="p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md mb-8">
            <h2 id="formTitle" class="text-lg font-bold mb-4 border-b pb-2 border-white/25">إضافة صف أو شعبة جديدة</h2>
            
            <form id="classForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="editType" value="">
                <input type="hidden" id="editIndex" value="-1">
                
                <div>
                    <label class="block text-sm font-semibold mb-2">نوع الإضافة:</label>
                    <select id="itemType" onchange="toggleInputs()" class="w-full px-4 py-2.5 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="class">صف دراسي جديد</option>
                        <option value="section">شعبة جديدة</option>
                    </select>
                </div>

                <div id="classNameBox">
                    <label class="block text-sm font-semibold mb-2">اسم الصف:</label>
                    <input type="text" id="clsName" class="w-full px-4 py-2.5 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="مثال: الرابع العلمي">
                </div>

                <div id="classCodeBox">
                    <label class="block text-sm font-semibold mb-2">اختصار الصف:</label>
                    <input type="text" id="clsCode" class="w-full px-4 py-2.5 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="مثال: 4 علمي">
                </div>

                <div id="sectionNameBox" class="hidden">
                    <label class="block text-sm font-semibold mb-2">اسم/رمز الشعبة:</label>
                    <input type="text" id="secName" class="w-full px-4 py-2.5 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="مثال: أ">
                </div>

                <!-- اختيار لون ثيم هذه الصفحة -->
                <div>
                    <label class="block text-sm font-semibold mb-2">🎨 لون ثيم هذه الصفحة:</label>
                    <select id="pageThemeSelect" onchange="changePageTheme(this.value)" class="w-full px-4 py-2.5 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="bg-indigo-900">نيللي غامق (افتراضي)</option>
                        <option value="bg-slate-900">الداكن الليلي</option>
                        <option value="bg-emerald-900">زمردي غامق</option>
                        <option value="bg-purple-900">أرجواني داكن</option>
                        <option value="bg-blue-600">أزرق حالم</option>
                        <option value="bg-teal-800">تيل مميز</option>
                        <option value="bg-rose-900">وردي داكن</option>
                        <option value="bg-slate-100 text-gray-900">رمادي فاتح نظيف</option>
                        <option value="bg-amber-50 text-gray-900">أصفر ذهبي ناعم</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="submitBtn" class="flex-grow bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition cursor-pointer">
                        ➕ إضافة
                    </button>
                    <button type="button" onclick="resetForm()" class="bg-gray-600 hover:bg-gray-500 text-white font-bold px-5 py-3 rounded-xl shadow-lg transition cursor-pointer">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>

        <!-- جدول الصفوف -->
        <div id="tableContainer1" class="p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md mb-8">
            <h2 class="text-lg font-bold mb-4 border-b pb-2 border-white/25">قائمة الصفوف الدراسية المسجلة</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-white/20 text-sm opacity-90">
                            <th class="py-2 px-3">الصف الدراسي</th>
                            <th class="py-2 px-3">الاختصار</th>
                            <th class="py-2 px-3 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="classesTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- جدول الشعب -->
        <div id="tableContainer2" class="p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md mb-8">
            <h2 class="text-lg font-bold mb-4 border-b pb-2 border-white/25">قائمة الشعب الدراسية المسجلة</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-white/20 text-sm opacity-90">
                            <th class="py-2 px-3">الشعبة</th>
                            <th class="py-2 px-3 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="sectionsTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- أزرار الحفظ والأسفل -->
        <div class="flex gap-4">
            <button onclick="saveAllChanges()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition cursor-pointer flex items-center justify-center gap-2">
                💾 حفظ الإعدادات
            </button>
            <button onclick="deleteAllData()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition cursor-pointer flex items-center justify-center gap-2">
                🗑️ حذف الكل
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer id="mainFooter" class="bg-slate-800 text-slate-300 border-t border-white/10 py-4 text-center text-sm transition-colors duration-300">
        منظومة بناء الجداول المدرسية الذكية &copy; 2026
    </footer>

    <script>
        let settings = JSON.parse(localStorage.getItem('sch_settings')) || { name: '' };
        document.getElementById('schoolNameHeader').innerText = settings.name || '';

        let pageSettings = JSON.parse(localStorage.getItem('classes_page_settings')) || { theme: 'bg-indigo-900' };

        function applyPageTheme(themeClass) {
            let body = document.getElementById('pageBody');
            let c1 = document.getElementById('cardContainer');
            let c2 = document.getElementById('tableContainer1');
            let c3 = document.getElementById('tableContainer2');
            let footer = document.getElementById('mainFooter');
            let selectBox = document.getElementById('pageThemeSelect');
            let itemType = document.getElementById('itemType');
            let clsName = document.getElementById('clsName');
            let clsCode = document.getElementById('clsCode');
            let secName = document.getElementById('secName');

            body.className = `${themeClass} min-h-screen flex flex-col justify-between transition-colors duration-300`;
            
            let isLight = themeClass.includes('slate-100') || themeClass.includes('amber-50');
            if (isLight) {
                body.className += " text-gray-900";
                let cardStyle = "p-6 rounded-2xl shadow-xl border bg-white/90 border-gray-300 text-gray-900 backdrop-blur-md mb-8";
                c1.className = cardStyle; c2.className = cardStyle; c3.className = cardStyle;
                footer.className = "bg-gray-200 text-gray-700 border-t border-gray-300 py-4 text-center text-sm transition-colors duration-300";
                
                let inputStyle = "w-full px-4 py-2.5 rounded-xl bg-white border border-gray-300 text-gray-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder-gray-400";
                itemType.className = inputStyle; clsName.className = inputStyle; clsCode.className = inputStyle; secName.className = inputStyle; selectBox.className = inputStyle;
            } else {
                body.className += " text-white";
                let cardStyle = "p-6 rounded-2xl shadow-xl border bg-white/10 border-white/20 text-white backdrop-blur-md mb-8";
                c1.className = cardStyle; c2.className = cardStyle; c3.className = cardStyle;
                footer.className = "bg-black/30 text-slate-300 border-t border-white/10 py-4 text-center text-sm transition-colors duration-300";
                
                let inputStyle = "w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white font-semibold focus:outline-none focus:ring-2 focus:ring-white/50 placeholder-gray-300";
                let selectStyle = "w-full px-4 py-2.5 rounded-xl bg-slate-800/80 border border-white/20 text-white font-semibold focus:outline-none focus:ring-2 focus:ring-white/50";
                itemType.className = selectStyle; clsName.className = inputStyle; clsCode.className = inputStyle; secName.className = inputStyle; selectBox.className = selectStyle;
            }
        }

        function changePageTheme(colorClass) {
            pageSettings.theme = colorClass;
            localStorage.setItem('classes_page_settings', JSON.stringify(pageSettings));
            applyPageTheme(colorClass);
        }

        if (pageSettings.theme) {
            document.getElementById('pageThemeSelect').value = pageSettings.theme;
            applyPageTheme(pageSettings.theme);
        }

        // البيانات الافتراضية المطلوبة
        const defaultClasses = [
            { name: "الأول المتوسط", code: "الأول" },
            { name: "الثاني المتوسط", code: "الثاني" },
            { name: "الثالث المتوسط", code: "الثالث" },
            { name: "الرابع العلمي", code: "4 علمي" },
            { name: "الخامس العلمي", code: "5 علمي" },
            { name: "السادس العلمي", code: "6 علمي" },
            { name: "الرابع الادبي", code: "4 ادبي" },
            { name: "الخامس الادبي", code: "5 ادبي" },
            { name: "السادس الادبي", code: "6 ادبي" }
        ];

        const defaultSections = [
            { name: "أ" }, { name: "ب" }, { name: "ج" }, { name: "د" }, { name: "هـ" }, { name: "و" }, { name: "ز" }
        ];

        let classesList = JSON.parse(localStorage.getItem('sch_classes'));
        if (!classesList || classesList.length === 0) {
            classesList = defaultClasses;
            localStorage.setItem('sch_classes', JSON.stringify(classesList));
        }

        let sectionsList = JSON.parse(localStorage.getItem('sch_sections'));
        if (!sectionsList || sectionsList.length === 0) {
            sectionsList = defaultSections;
            localStorage.setItem('sch_sections', JSON.stringify(sectionsList));
        }

        function toggleInputs() {
            let type = document.getElementById('itemType').value;
            if (type === 'class') {
                document.getElementById('classNameBox').style.display = 'block';
                document.getElementById('classCodeBox').style.display = 'block';
                document.getElementById('sectionNameBox').style.display = 'none';
            } else {
                document.getElementById('classNameBox').style.display = 'none';
                document.getElementById('classCodeBox').style.display = 'none';
                document.getElementById('sectionNameBox').style.display = 'block';
            }
        }

        function renderTables() {
            let clsBody = document.getElementById('classesTableBody');
            let secBody = document.getElementById('sectionsTableBody');
            clsBody.innerHTML = '';
            secBody.innerHTML = '';

            classesList.forEach((cls, index) => {
                clsBody.innerHTML += `
                    <tr class="border-b border-white/10 hover:bg-white/5 transition">
                        <td class="py-3 px-3 font-semibold">${cls.name}</td>
                        <td class="py-3 px-3 font-mono">${cls.code}</td>
                        <td class="py-3 px-3 text-center space-x-2 space-x-reverse">
                            <button onclick="editItem('class', ${index})" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">✏️ تعديل</button>
                            <button onclick="deleteItem('class', ${index})" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">🗑️ حذف</button>
                        </td>
                    </tr>`;
            });

            sectionsList.forEach((sec, index) => {
                secBody.innerHTML += `
                    <tr class="border-b border-white/10 hover:bg-white/5 transition">
                        <td class="py-3 px-3 font-semibold">${sec.name}</td>
                        <td class="py-3 px-3 text-center space-x-2 space-x-reverse">
                            <button onclick="editItem('section', ${index})" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">✏️ تعديل</button>
                            <button onclick="deleteItem('section', ${index})" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">🗑️ حذف</button>
                        </td>
                    </tr>`;
            });
        }

        function saveItem(event) {
            event.preventDefault();
            let type = document.getElementById('itemType').value;
            let editType = document.getElementById('editType').value;
            let editIndex = parseInt(document.getElementById('editIndex').value);

            if (type === 'class') {
                let name = document.getElementById('clsName').value.trim();
                let code = document.getElementById('clsCode').value.trim();
                if (!name || !code) return;

                if (editIndex === -1 || editType !== 'class') {
                    classesList.push({ name, code });
                } else {
                    classesList[editIndex] = { name, code };
                }
            } else {
                let name = document.getElementById('secName').value.trim();
                if (!name) return;

                if (editIndex === -1 || editType !== 'section') {
                    sectionsList.push({ name });
                } else {
                    sectionsList[editIndex] = { name };
                }
            }

            localStorage.setItem('sch_classes', JSON.stringify(classesList));
            localStorage.setItem('sch_sections', JSON.stringify(sectionsList));
            resetForm();
            renderTables();
        }

        function editItem(type, index) {
            document.getElementById('itemType').value = type;
            toggleInputs();
            document.getElementById('editType').value = type;
            document.getElementById('editIndex').value = index;

            if (type === 'class') {
                let item = classesList[index];
                document.getElementById('clsName').value = item.name;
                document.getElementById('clsCode').value = item.code;
            } else {
                let item = sectionsList[index];
                document.getElementById('secName').value = item.name;
            }

            document.getElementById('formTitle').innerText = 'تعديل البيانات';
            document.getElementById('submitBtn').innerText = '💾 حفظ التعديلات';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(type, index) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                if (type === 'class') {
                    classesList.splice(index, 1);
                    localStorage.setItem('sch_classes', JSON.stringify(classesList));
                } else {
                    sectionsList.splice(index, 1);
                    localStorage.setItem('sch_sections', JSON.stringify(sectionsList));
                }
                renderTables();
            }
        }

        function saveAllChanges() {
            localStorage.setItem('sch_classes', JSON.stringify(classesList));
            localStorage.setItem('sch_sections', JSON.stringify(sectionsList));
            alert('تم حفظ إعدادات الصفوف والشعب بنجاح!');
        }

        function deleteAllData() {
            if (confirm('هل أنت متأكد من حذف جميع الصفوف والشعب؟')) {
                classesList = []; sectionsList = [];
                localStorage.removeItem('sch_classes');
                localStorage.removeItem('sch_sections');
                renderTables();
            }
        }

        function resetForm() {
            document.getElementById('classForm').reset();
            document.getElementById('editIndex').value = -1;
            document.getElementById('editType').value = '';
            document.getElementById('formTitle').innerText = 'إضافة صف أو شعبة جديدة';
            document.getElementById('submitBtn').innerText = '➕ إضافة';
            toggleInputs();
        }

        renderTables();
    </script>
</body>
</html>
